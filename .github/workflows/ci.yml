name: CI

on:
  pull_request:
  push:
    branches: [ "phase-1", "phase-2" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src scripts

      - name: Smoke train
        run: python scripts/ci_smoke.py

      - name: Eval
        run: python scripts/ci_eval.py

      - name: Make report
        run: python scripts/ci_report.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            reports/metrics/ci_metrics.json
            reports/ci_report.md
